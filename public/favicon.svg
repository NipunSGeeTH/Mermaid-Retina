<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>
    
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>
    
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)" />

  <circle cx="210" cy="50" r="60" fill="#FFB75E" opacity="0.8" />
  <circle cx="40" cy="220" r="80" fill="#ED213A" opacity="0.8" />

  <rect x="24" y="24" width="208" height="208" rx="48" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" filter="url(#blur)" />

  <path d="M 128 96 L 128 128 L 72 128 L 72 144 M 128 128 L 184 128 L 184 144" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="4" stroke-linejoin="round" />

  <rect x="88" y="56" width="80" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.2" stroke="#FFFFFF" stroke-width="4" />
  
  <polyline points="116,68 108,76 116,84" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="140,68 148,76 140,84" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <rect x="40" y="144" width="64" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="72" cy="164" r="6" fill="#00FFFF" filter="url(#glow)" />

  <rect x="152" y="144" width="64" height="40" rx="12" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-width="3" />
