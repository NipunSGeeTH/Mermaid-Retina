<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mermaid Exporter</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <header class="app-header">
      <h1 class="app-title">Mermaid Exporter</h1>

      <label for="theme" class="sr-only">Theme</label>
      <select id="theme" class="control" aria-label="Mermaid theme">
        <option value="default">Default</option>
        <option value="dark" selected>Dark</option>
        <option value="forest">Forest</option>
        <option value="neutral">Neutral</option>
      </select>

      <label for="scale" class="sr-only">Export scale</label>
      <select id="scale" class="control" aria-label="PNG export scale">
        <option value="1">1x</option>
        <option value="2" selected>2x HD</option>
        <option value="4">4x Ultra</option>
      </select>

      <button id="exportBtn" class="export-btn" type="button">Export PNG</button>
    </header>

    <main class="main">
      <textarea id="editor" spellcheck="false" aria-label="Mermaid code editor">graph TD
  A[Start] --> B{Is it working?}
  B -->|Yes| C[Great!]
  B -->|No| D[Debug it]
  D --> A</textarea>

      <section id="preview" class="preview" aria-live="polite"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@resvg/resvg-wasm@2.4.1/index.min.js"></script>
    <script src="scripts/app.js"></script>
  </body>
</html>
